<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dépôt de fichiers</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1c1a; --muted: #6b6862; --line: #e4e1da;
    --accent: #2f5fd0; --accent-ink: #ffffff; --ok: #1f7a4a; --err: #b3261e; --bar: #e9e6df;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --ink: #ecebe7; --muted: #a3a09a; --line: #34332f;
      --accent: #7aa2ff; --accent-ink: #0d1530; --ok: #6fcf97; --err: #ff8a80; --bar: #2c2b28; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; word-break: break-word; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 1rem; margin: 0 0 12px; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=password] { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); width: 100%; max-width: 320px; }
  form.row { display: flex; gap: 8px; flex-wrap: wrap; }
  .msg { padding: 10px 12px; border-radius: 8px; background: var(--bar); margin-top: 12px; }
  .msg.err { color: var(--err); }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 8px; color: var(--muted); }
  .crumbs a { color: var(--accent); text-decoration: none; cursor: pointer; }
  ul.list { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
  ul.list li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 4px; border-top: 1px solid var(--line); }
  ul.list li:first-child { border-top: 0; }
  ul.list .name { word-break: break-all; }
  ul.list .folder { color: var(--accent); cursor: pointer; }
  ul.list .size { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 32px 16px; text-align: center; color: var(--muted); }
  .drop.over { border-color: var(--accent); color: var(--ink); }
  .queue { margin-top: 16px; }
  .item { padding: 10px 0; border-top: 1px solid var(--line); }
  .item .top { display: flex; justify-content: space-between; gap: 12px; }
  .item .fname { word-break: break-all; }
  .item .state { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .item.done .state { color: var(--ok); }
  .item.failed .state { color: var(--err); }
  .bar { height: 6px; background: var(--bar); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .item.done .bar > div { background: var(--ok); }
  .switch { display: flex; align-items: center; gap: 10px; }
  .muted { color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Dépôt de fichiers</h1>
  <p class="sub" id="subtitle">Chargement…</p>

  <section class="card" id="owner" hidden>
    <h2>Réglages du propriétaire</h2>
    <label class="switch"><input type="checkbox" id="allow"> <span>Autoriser le dépôt de fichiers via ce lien</span></label>
    <p class="muted" id="ownerHint"></p>
  </section>

  <section class="card" id="closed" hidden>
    <p id="closedMsg"></p>
  </section>

  <section class="card" id="unlock" hidden>
    <h2>Ce dossier est protégé</h2>
    <form class="row" id="unlockForm">
      <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password" required>
      <button class="primary" type="submit">Ouvrir</button>
    </form>
    <div class="msg err" id="unlockErr" hidden></div>
  </section>

  <section id="app" hidden>
    <div class="card">
      <h2>Contenu</h2>
      <nav class="crumbs" id="crumbs"></nav>
      <ul class="list" id="list"></ul>
      <p class="muted" id="empty" hidden>Ce dossier est vide.</p>
      <p style="margin:12px 0 0"><a class="btn" id="browse" target="_blank" rel="noopener">Parcourir et télécharger</a></p>
    </div>

    <div class="card">
      <h2>Déposer dans <span id="target"></span></h2>
      <div class="drop" id="dropzone">
        <p>Glissez vos fichiers ici</p>
        <p><button class="primary" id="pick" type="button">Choisir des fichiers</button></p>
        <input type="file" id="files" multiple hidden>
      </div>
      <div class="queue" id="queue"></div>
    </div>
  </section>
</main>

<script>
(() => {
  const shareId = location.pathname.split('/').filter(Boolean).pop();
  const api = `/api/drop/${encodeURIComponent(shareId)}`;
  const $ = (id) => document.getElementById(id);
  let info = null, auth = null, cwd = '/', busy = false;
  const queue = [];

  const fmt = (n) => {
    if (n == null) return '';
    const u = ['o', 'Ko', 'Mo', 'Go', 'To']; let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return `${n.toFixed(i === 0 ? 0 : 1)} ${u[i]}`;
  };
  const basic = (pw) => 'Basic ' + btoa(String.fromCharCode(...new TextEncoder().encode('drop:' + pw)));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function show(id, on = true) { $(id).hidden = !on; }

  async function json(res) {
    try { return await res.json(); } catch { return {}; }
  }

  async function init() {
    const res = await fetch(api, { credentials: 'same-origin' });
    const body = await json(res);
    if (!res.ok) {
      $('subtitle').textContent = '';
      $('closedMsg').textContent = res.status === 404 ? "Ce lien n'existe pas ou a expiré." : (body.error || 'Erreur.');
      show('closed');
      return;
    }
    info = body;
    $('title').textContent = info.name;
    $('subtitle').textContent = info.expiresAt
      ? `Lien valable jusqu'au ${new Date(info.expiresAt).toLocaleString('fr-FR')}` : '';
    $('browse').href = `/share/${encodeURIComponent(shareId)}`;

    if (info.isOwner) renderOwner();

    if (!info.folder) return closed("Le dépôt n'est possible que sur un dossier partagé.");
    if (!info.allowUpload) {
      return closed(info.isOwner ? 'Le dépôt est fermé. Activez-le ci-dessus.'
                                 : "Ce lien n'accepte pas de dépôt de fichiers.");
    }
    show('closed', false);
    let saved = null;
    try { saved = sessionStorage.getItem('drop:' + shareId); } catch {}
    if (saved && await tryUnlock(saved)) return;
    show('unlock');
    $('password').focus();
  }

  function closed(text) { $('closedMsg').textContent = text; show('closed'); }

  function renderOwner() {
    show('owner');
    const box = $('allow');
    box.checked = info.allowUpload;
    box.disabled = !info.folder || !info.protected;
    $('ownerHint').textContent = !info.folder ? 'Le dépôt ne fonctionne que sur un dossier partagé.'
      : !info.protected ? 'Ajoutez un mot de passe à ce partage dans teldrive pour pouvoir ouvrir le dépôt.'
      : 'Les visiteurs devront saisir le mot de passe du partage. Ils pourront voir le contenu du dossier et y déposer des fichiers.';
    box.onchange = async () => {
      box.disabled = true;
      const res = await fetch(api, { method: 'PATCH', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ allowUpload: box.checked }) });
      const body = await json(res);
      if (!res.ok) { box.checked = !box.checked; alert(body.error || 'Erreur'); }
      box.disabled = false;
      location.reload();
    };
  }

  async function tryUnlock(pw) {
    const a = basic(pw);
    const res = await fetch(`/api/shares/${encodeURIComponent(shareId)}/files?path=%2F&limit=1`, { headers: { Authorization: a } });
    if (!res.ok) return false;
    auth = a;
    try { sessionStorage.setItem('drop:' + shareId, pw); } catch {}
    show('unlock', false);
    show('app');
    await openDir('/');
    return true;
  }

  $('unlockForm').onsubmit = async (e) => {
    e.preventDefault();
    show('unlockErr', false);
    if (!(await tryUnlock($('password').value))) {
      $('unlockErr').textContent = 'Mot de passe incorrect.';
      show('unlockErr');
    }
  };

  async function openDir(p) {
    cwd = p;
    const q = new URLSearchParams({ path: p, limit: '500', page: '1', sort: 'name', order: 'asc' });
    const res = await fetch(`/api/shares/${encodeURIComponent(shareId)}/files?${q}`, { headers: { Authorization: auth } });
    const body = await json(res);
    const list = $('list');
    list.replaceChildren();
    const items = (body.items || []).sort((a, b) => (a.type === b.type ? 0 : a.type === 'folder' ? -1 : 1));
    for (const it of items) {
      const li = document.createElement('li');
      const name = document.createElement('span');
      name.className = 'name' + (it.type === 'folder' ? ' folder' : '');
      name.textContent = (it.type === 'folder' ? '📁 ' : '') + it.name;
      if (it.type === 'folder') name.onclick = () => openDir((p === '/' ? '' : p) + '/' + it.name);
      const size = document.createElement('span');
      size.className = 'size';
      size.textContent = it.type === 'folder' ? '' : fmt(it.size);
      li.append(name, size);
      list.append(li);
    }
    show('empty', items.length === 0);
    renderCrumbs();
  }

  function renderCrumbs() {
    const nav = $('crumbs');
    nav.replaceChildren();
    const parts = cwd.split('/').filter(Boolean);
    const add = (label, target) => {
      const a = document.createElement('a');
      a.textContent = label;
      a.onclick = () => openDir(target);
      nav.append(a);
    };
    add(info.name, '/');
    let acc = '';
    for (const seg of parts) {
      acc += '/' + seg;
      nav.append(document.createTextNode(' / '));
      add(seg, acc);
    }
    $('target').textContent = parts.length ? parts[parts.length - 1] : info.name;
  }

  // ---- dépôt ----
  const zone = $('dropzone');
  $('pick').onclick = () => $('files').click();
  $('files').onchange = (e) => { enqueue([...e.target.files]); e.target.value = ''; };
  zone.ondragover = (e) => { e.preventDefault(); zone.classList.add('over'); };
  zone.ondragleave = () => zone.classList.remove('over');
  zone.ondrop = (e) => { e.preventDefault(); zone.classList.remove('over'); enqueue([...e.dataTransfer.files]); };

  function enqueue(files) {
    for (const f of files) {
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = '<div class="top"><span class="fname"></span><span class="state"></span></div><div class="bar"><div></div></div>';
      el.querySelector('.fname').textContent = f.name;
      const job = { file: f, dir: cwd, el, cancel: false, uploadId: null };
      const btn = document.createElement('button');
      btn.textContent = 'Annuler';
      btn.style.marginLeft = '8px';
      btn.onclick = () => { job.cancel = true; btn.disabled = true; };
      el.querySelector('.top').append(btn);
      job.btn = btn;
      $('queue').append(el);
      state(job, 'en attente');
      queue.push(job);
    }
    pump();
  }

  function state(job, text, cls) {
    job.el.querySelector('.state').textContent = text;
    if (cls) job.el.classList.add(cls);
  }
  function progress(job, sent) {
    const pct = job.file.size ? Math.floor((sent / job.file.size) * 100) : 100;
    job.el.querySelector('.bar > div').style.width = pct + '%';
    state(job, `${pct} % · ${fmt(sent)} / ${fmt(job.file.size)}`);
  }

  window.addEventListener('beforeunload', (e) => { if (busy) { e.preventDefault(); e.returnValue = ''; } });

  async function pump() {
    if (busy) return;
    busy = true;
    while (queue.length) {
      const job = queue.shift();
      try {
        await upload(job);
        state(job, 'envoyé ✓', 'done');
        job.el.querySelector('.bar > div').style.width = '100%';
        if (job.dir === cwd) openDir(cwd);
      } catch (err) {
        state(job, job.cancel ? 'annulé' : 'échec : ' + err.message, 'failed');
        if (job.uploadId) fetch(`${api}/uploads/${job.uploadId}`, { method: 'DELETE', headers: { Authorization: auth } });
      }
      job.btn.remove();
    }
    busy = false;
  }

  async function upload(job) {
    const f = job.file;
    if (f.size === 0) throw new Error('fichier vide');
    let res = await fetch(`${api}/uploads`, {
      method: 'POST', headers: { Authorization: auth, 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: f.name, size: f.size, path: job.dir, mimeType: f.type }),
    });
    let body = await json(res);
    if (!res.ok) throw new Error(body.error || `erreur ${res.status}`);
    job.uploadId = body.uploadId;
    const { parts, partSize, chunkSize } = body;

    let part = 1, offset = 0, failures = 0;
    progress(job, 0);
    while (part <= parts) {
      if (job.cancel) throw new Error('annulé');
      const partStart = (part - 1) * partSize;
      const partLen = Math.min(partSize, f.size - partStart);
      const end = Math.min(offset + chunkSize, partLen);
      try {
        res = await fetch(`${api}/uploads/${job.uploadId}/parts/${part}?offset=${offset}`, {
          method: 'PUT', headers: { Authorization: auth, 'Content-Type': 'application/octet-stream' },
          body: f.slice(partStart + offset, partStart + end),
        });
        body = await json(res);
      } catch (e) {
        res = null;
      }
      if (res && res.ok) {
        failures = 0;
        if (body.partDone) { part++; offset = 0; } else { offset = body.received; }
        progress(job, (part - 1) * partSize + offset);
        continue;
      }
      if (res && res.status === 409 && body.expectedPart !== undefined) {
        // Le serveur indique où reprendre : simple décalage (réponse perdue)
        // ou morceau à recommencer après une erreur.
        part = body.expectedPart; offset = body.expectedOffset;
        progress(job, (part - 1) * partSize + offset);
        if (!body.error) continue;
        failures++;
      } else if (res && res.status < 500) {
        throw new Error(body.error || `erreur ${res.status}`);
      } else {
        failures++;
      }
      if (failures > 8) throw new Error('trop d\'échecs, réessayez plus tard');
      state(job, `nouvelle tentative (${failures})…`);
      await sleep(Math.min(30000, 1500 * 2 ** failures));
    }

    state(job, 'finalisation…');
    res = await fetch(`${api}/uploads/${job.uploadId}/complete`, { method: 'POST', headers: { Authorization: auth } });
    body = await json(res);
    if (!res.ok) throw new Error(body.error || `erreur ${res.status}`);
    if (body.name && body.name !== f.name) job.el.querySelector('.fname').textContent = `${f.name} → ${body.name}`;
  }

  init().catch((e) => { $('subtitle').textContent = ''; closed('Erreur : ' + e.message); });
})();
</script>
</body>
</html>
